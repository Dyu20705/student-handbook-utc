[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "student-handbook-rag"
version = "0.2.0"
description = "A lightweight RAG system for UTC student handbook"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain-core>=1,<2",
    "langchain-text-splitters>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-chroma>=1,<2",
    "pypdf>=6,<7",
    "filelock>=3.20,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "requests>=2.33,<3",
]

[project.optional-dependencies]
experimental = ["sentence-transformers>=5,<6", "langchain-classic>=1,<2", "langchain-community>=0.4,<1", "beautifulsoup4>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[project.scripts]
utc-ask = "student_handbook_rag.ask:main"
utc-ingest = "student_handbook_rag.ingest:main"
utc-serve = "student_handbook_rag.api:main"
utc-doctor = "student_handbook_rag.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
student_handbook_rag = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires local Ollama models and an ingested handbook", "experimental: optional research modules requiring additional dependencies"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
