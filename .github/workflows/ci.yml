name: Local RAG checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.12'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked python -m ruff check src tests scripts/check_distribution.py scripts/run_qualification.py
      - run: uv run --locked python -m ruff format --check src tests scripts/check_distribution.py scripts/run_qualification.py
      - name: Offline functional and API contract tests
        run: uv run --locked python -m pytest -q
      - run: uv build
      - name: Verify distribution inventory independently of historical evidence
        run: uv run --locked python scripts/check_distribution.py dist
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.12'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Enforce security exception review deadline
        run: >-
          uv run --locked python -c "from datetime import date;
          assert date.today() <= date(2026, 11, 13), 'Review Chroma exceptions in docs/security.md'"
      # Embedded-only exceptions: rationale, scope and deadline in docs/security.md.
      - run: uv run --locked python -m pip_audit --local --skip-editable --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815 --ignore-vuln PYSEC-2026-3813
  workflow-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject transient release-tree artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '^(docs/(local|research|qualification)/|data/runtime/|data/benchmark/eval_results[^/]*[.]json$|[.]env$)'; then
            echo "Transient or private artifacts must not be tracked" >&2
            exit 1
          fi
          test -f .github/pull_request_template.md
      - name: Validate workflows with pinned actionlint
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint_1.7.7_linux_amd64.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          ./actionlint "$GITHUB_WORKSPACE/.github/workflows/ci.yml"
      - name: Scan complete Git history with pinned gitleaks
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks_8.24.3_linux_x64.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --log-opts='--all --no-textconv' --gitleaks-ignore-path "$GITHUB_WORKSPACE/.gitleaksignore" "$GITHUB_WORKSPACE"
